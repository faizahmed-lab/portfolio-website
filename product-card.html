<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shirt Product Card</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .product-card {
            width: 260px;
            margin: 50px auto;
            padding: 15px;
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            text-align: center;
        }

        .product-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        button {
            padding: 10px 18px;
            background-color: #222;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="product-card">
        <img src="https://www.mydesignation.com/cdn/shop/files/navy-blue-cotton-shirt-shirt-mydesignation-6272740.jpg?v=1783198692" alt="Blue casual shirt">

        <h2>Classic Casual Shirt</h2>
        <p>A comfortable shirt for everyday wear.</p>
        <p><strong>₹799</strong></p>

        <button type="button">Add to Cart</button>
    </div>

</body>
</html>
