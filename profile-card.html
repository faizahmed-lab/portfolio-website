<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faiz Ahmed — Profile Card</title>

    <!-- A little CSS for the card layout -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            padding: 40px;
        }

        .profile-card {
            background-color: white;
            max-width: 350px;
            margin: auto;
            padding: 20px;
            border-radius: 12px;
        }

        .profile-card img {
            width: 180px;
            height: 200px;
            object-fit: cover;
            object-position: center 75%;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <img src="faiz-photo.png" alt="Photo of Faiz Ahmed">

        <h1>Faiz Ahmed</h1>
        <p><strong>Age:</strong> 19</p>
        <p><strong>From:</strong> Nagpur, Maharashtra</p>

        <p>
            I’m an aspiring developer learning to create websites with
            HTML and CSS. I enjoy bringing ideas to life and improving
            my skills through small projects.
        </p>
    </div>

</body>
</html>
